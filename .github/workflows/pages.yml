name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build read-only site
        run: npm run build:pages
        env:
          VITE_GH_BRANCH: ${{ github.ref_name }}
          # Sign in with GitHub (#92). Repo variables can't start with GITHUB_, hence QUEST_.
          # Leave them unset (forks) and the site keeps the pasted-token flow only.
          VITE_AUTH_URL: ${{ vars.QUEST_AUTH_URL }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.QUEST_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.QUEST_APP_SLUG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
