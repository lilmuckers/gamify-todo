<!doctype html>
<html lang="en">

    <!-- Never send this page's address (a sign-in callback's ?code=, say) to another site. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quest Log</title>
    <meta name="description" content="A project tracker you play: worlds, levels and good-enough deliverables." />
    <meta name="theme-color" content="#1a1c2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quest Log" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Boot splash: inline so it paints before any script or stylesheet arrives. main.ts clears it. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #1a1c2c;
        color: #f4f4f4;
        font: 700 12px/1 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        transition: opacity 0.2s steps(4);
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-penguin {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        /* A one-sprite-pixel outline so the black lifts off the dark background. */
        filter: drop-shadow(4px 0 0 #5a6988) drop-shadow(-4px 0 0 #5a6988) drop-shadow(0 4px 0 #5a6988) drop-shadow(0 -4px 0 #5a6988);
        animation: boot-drop 0.3s steps(6) both;
      }
      .boot-word {
        position: relative;
        overflow: hidden;
        padding: 4px 6px;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #fee761;
        text-shadow: 3px 3px 0 #e43b44, 6px 6px 0 #262b44;
        animation: boot-pop 0.25s 0.15s steps(5) both;
      }
      .boot-word::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 -40%;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        transform: translateX(0) skewX(-20deg);
        /* Transform only, so it runs on the compositor and doesn't stall while the app's scripts parse. */
        will-change: transform;
        animation: boot-shine 0.45s 0.4s ease-out both;
      }
      .boot-sub {
        letter-spacing: 0.3em;
        color: #9badb7;
        animation: boot-blink 0.8s 0.5s steps(2) infinite both;
      }
      /* Shown in a sign-in popup whose Quest Log tab has gone (auth/signin.ts answerPopup). */
      .boot-action {
        padding: 10px 14px;
        border: 2px solid #f4f4f4;
        background: #e43b44;
        color: #f4f4f4;
        font: inherit;
        cursor: pointer;
      }
      @keyframes boot-drop {
        from { transform: translateY(-60px); opacity: 0; }
      }
      @keyframes boot-pop {
        from { transform: scale(0.4); opacity: 0; }
      }
      @keyframes boot-shine {
        /* 6 of its own widths (30% each) carries it from -40% to 140% of the word. */
        to { transform: translateX(600%) skewX(-20deg); }
      }
      @keyframes boot-blink {
        50% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
